services:
  - type: web
    name: marqs-gym-chatbot
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 60
    envVars:
      - key: PHONE_NUMBER_ID
        value: "1396723693530591"
      - key: VERIFY_TOKEN
        value: daniel_2026_bot
      - key: WHATSAPP_TOKEN
        sync: false
